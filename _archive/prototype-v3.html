<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Nova's Pack</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap">
</head>
<body>
<style>
/* Layout: one phone-width column, sticky header, fixed bottom tab bar. Palette from Nova's photos: Shannon dusk blue = trust (token still named --spruce), Nova tan = the mascot, sunset gold = XP. */
:root{
  --bg:#F3F2EB; --surface:#FFFFFF; --sunk:#EAE7DD; --line:#DEDACD; --ctl:#958C7E;
  --ink:#1E1B17; --muted:#5C544B;
  --spruce:#1F4E6E; --ledge:#13344B; --on-spruce:#FFFFFF; --spruce-soft:#DDE8F1;
  --tan:#C27A3A; --tan-ink:#8E5019; --tan-soft:#F4E3D1;
  --gold:#F2B544; --on-gold:#1E1B17; --gold-soft:#FBEBC6;
  --ok:#2F7D52; --danger:#B3402A; --danger-soft:#FBE7E1;
  --shadow:0 1px 2px rgba(30,27,23,.06),0 6px 16px rgba(30,27,23,.08);
  --f-display:"Bricolage Grotesque","Avenir Next","Segoe UI",system-ui,sans-serif;
  --f-body:"Plus Jakarta Sans","Segoe UI",system-ui,-apple-system,sans-serif;
  --r-card:16px; --r-btn:12px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#14120F; --surface:#211D19; --sunk:#2A2520; --line:#3A332C; --ctl:#7D7266;
  --ink:#F5EEE4; --muted:#B5A898;
  --spruce:#8EC1E0; --ledge:#5C93B5; --on-spruce:#0E1218; --spruce-soft:#1A2A36;
  --tan:#E3A468; --tan-ink:#E3A468; --tan-soft:#3A2A1D;
  --gold:#F5C35B; --on-gold:#1E1B17; --gold-soft:#3A3018;
  --ok:#6CCB94; --danger:#F08A72; --danger-soft:#3A211B;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 16px rgba(0,0,0,.35); color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#14120F; --surface:#211D19; --sunk:#2A2520; --line:#3A332C; --ctl:#7D7266;
  --ink:#F5EEE4; --muted:#B5A898;
  --spruce:#8EC1E0; --ledge:#5C93B5; --on-spruce:#0E1218; --spruce-soft:#1A2A36;
  --tan:#E3A468; --tan-ink:#E3A468; --tan-soft:#3A2A1D;
  --gold:#F5C35B; --on-gold:#1E1B17; --gold-soft:#3A3018;
  --ok:#6CCB94; --danger:#F08A72; --danger-soft:#3A211B;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 16px rgba(0,0,0,.35); color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--f-body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px;border-radius:8px}
h1,h2,h3{font-family:var(--f-display);line-height:1.1;margin:0;text-wrap:balance;letter-spacing:-.01em}
h2{font-size:1.35rem;font-weight:800}
h3{font-size:1.05rem;font-weight:800}
p{margin:0}
.muted{color:var(--muted)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.small{font-size:.85rem}
.num{font-variant-numeric:tabular-nums}
.eyebrow{font-size:.72rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}

/* shell */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top-in{max-width:620px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:10px}
.brand{display:flex;align-items:center;gap:8px;font-family:var(--f-display);font-weight:800;font-size:1.05rem;margin-right:auto;background:none;border:0;padding:0;white-space:nowrap;min-width:0}
.brand svg{width:34px;height:34px}
.lvl-chip{white-space:nowrap;display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px 10px 4px 4px;font-size:.8rem;font-weight:700}
.lvl-badge{width:26px;height:26px;border-radius:50%;background:var(--gold);color:var(--on-gold);display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:.85rem}
.sos{white-space:nowrap;border:1.5px solid var(--danger);color:var(--danger);background:transparent;border-radius:999px;padding:5px 10px;font-weight:700;font-size:.78rem;display:flex;align-items:center;gap:5px}
.sos svg{width:15px;height:15px}
main{max-width:620px;margin:0 auto;padding-inline:16px;padding-block:16px 120px;display:flex;flex-direction:column;gap:18px}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs-in{max-width:620px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.tab{background:none;border:0;padding:8px 2px 9px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.7rem;font-weight:600;color:var(--muted)}
.tab svg{width:23px;height:23px}
.tab[aria-current="page"]{color:var(--spruce)}
.tab[aria-current="page"] svg{stroke-width:2.4}

/* primitives */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-card);padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.row{display:flex;align-items:center;gap:10px;min-width:0}
.row.wrap{flex-wrap:wrap}
.between{justify-content:space-between}
.grow{flex:1;min-width:0}
.stack{display:flex;flex-direction:column;gap:10px}
a{color:var(--spruce)}
a.btn{text-decoration:none}
.btn{border:0;border-radius:var(--r-btn);padding:11px 16px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:7px;background:var(--sunk);color:var(--ink);transition:transform .12s ease-out}
.btn:active{transform:translateY(2px)}
.btn svg{width:18px;height:18px}
.btn.primary{background:var(--spruce);color:var(--on-spruce);box-shadow:0 3px 0 var(--ledge)}
.btn.primary:active{box-shadow:0 1px 0 var(--ledge)}
.btn.gold{background:var(--gold);color:var(--on-gold);box-shadow:0 3px 0 color-mix(in srgb,var(--gold) 60%,#000)}
.btn.danger{background:var(--danger);color:var(--surface)}
.btn.ghost{background:transparent;border:1.5px solid var(--ctl)}
.btn.sm{padding:7px 12px;font-size:.85rem;border-radius:10px}
.btn.block{width:100%}
.btn[disabled]{opacity:.5;cursor:default}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1.5px solid var(--ctl);background:var(--surface);border-radius:999px;padding:6px 13px;font-weight:600;font-size:.85rem}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.pill{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:2px 9px;font-size:.74rem;font-weight:700;background:var(--sunk);color:var(--muted);white-space:nowrap}
.pill svg{width:13px;height:13px}
.pill.spruce{background:var(--spruce-soft);color:var(--spruce)}
.pill.tan{background:var(--tan-soft);color:var(--tan-ink)}
.pill.gold{background:var(--gold-soft);color:var(--ink)}
.pill.danger{background:var(--danger-soft);color:var(--danger)}
.example{font-size:.72rem;font-weight:700;color:var(--muted);border:1px dashed var(--line);border-radius:999px;padding:1px 8px}
.bar{height:10px;background:var(--sunk);border-radius:999px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--gold);border-radius:999px;transition:width .5s cubic-bezier(.3,1.3,.5,1)}
.bar.spruce>i{background:var(--spruce)}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--sunk);border-radius:12px;padding:4px;gap:4px}
.seg button{border:0;background:transparent;border-radius:9px;padding:8px;font-weight:700;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.ava{width:40px;height:40px;border-radius:50%;flex:none;overflow:hidden;background:var(--sunk)}
.ava svg,.ava img{width:100%;height:100%;display:block;object-fit:cover}
.section-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-weight:700;font-size:.85rem}
.input,select.input,textarea.input{width:100%;border:1.5px solid var(--ctl);background:var(--surface);border-radius:12px;padding:10px 12px}
textarea.input{min-height:84px;resize:vertical}
.input:focus{outline:none;border-color:var(--spruce)}
.note{border-radius:12px;padding:10px 12px;font-size:.85rem;display:flex;gap:8px;align-items:flex-start}
.note svg{width:18px;height:18px;flex:none;margin-top:1px}
.note.danger{background:var(--danger-soft);color:var(--danger)}
.note.info{background:var(--spruce-soft);color:var(--spruce)}
.note.gold{background:var(--gold-soft);color:var(--ink)}

/* hero */
.hello{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center}
.hello .nova{width:84px;height:84px}
.speech{background:var(--surface);border:1px solid var(--line);border-radius:16px 16px 16px 4px;padding:10px 14px;font-weight:500}
.hero{position:relative;border-radius:20px;overflow:hidden;aspect-ratio:4/3;max-width:100%;background:var(--sunk)}
.hero>img{width:100%;height:100%;object-fit:cover;object-position:center 35%;display:block}
.hero-over{position:absolute;left:0;right:0;bottom:0;padding:48px 14px 14px;background:linear-gradient(transparent,rgba(8,12,18,.82));display:flex;flex-direction:column;gap:8px}
.hero-over .eyebrow{color:#F5EEE4}
.hero-over .speech{border:0}
.gram{display:grid;grid-auto-flow:column;grid-auto-columns:38%;gap:8px;overflow-x:auto;scrollbar-width:none}
.gram::-webkit-scrollbar{display:none}
.gram img{width:100%;aspect-ratio:1;max-width:100%;object-fit:cover;border-radius:12px;display:block}
.progress-card{background:var(--spruce);color:var(--on-spruce);border:0}
.progress-card .muted{color:color-mix(in srgb,var(--on-spruce) 85%,transparent)}
.progress-card .bar{background:color-mix(in srgb,var(--on-spruce) 20%,transparent)}
.big-level{font-family:var(--f-display);font-weight:800;font-size:2.4rem;line-height:1}
.statline{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:color-mix(in srgb,var(--on-spruce) 12%,transparent);border-radius:12px;padding:8px 10px}
.stat b{display:block;font-family:var(--f-display);font-size:1.25rem}
.stat span{font-size:.72rem}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.day{aspect-ratio:1;max-width:100%;border-radius:50%;display:grid;place-items:center;font-size:.72rem;font-weight:700;background:var(--sunk);color:var(--muted)}
.day.on{background:var(--gold);color:var(--on-gold)}
.day.today{outline:2px solid var(--spruce);outline-offset:2px}
.quick{display:grid;grid-template-columns:1fr 1fr;gap:10px}

/* challenges */
.chal{display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:center;padding:10px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface)}
.chal.picked{border-color:var(--spruce)}
.chal.done{background:var(--spruce-soft);border-color:transparent}
.chal-ico{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;background:var(--tan-soft);color:var(--tan-ink)}
.chal-ico svg{width:22px;height:22px}
.chal .t{font-weight:700;line-height:1.25}
.xp{font-weight:800;color:var(--tan-ink);font-size:.82rem}

/* feed */
.post{padding:0;overflow:hidden;gap:0}
.post-head{padding:12px 14px;display:flex;gap:10px;align-items:center}
.post-photo{aspect-ratio:16/11;max-width:100%;width:100%;background:var(--sunk);display:block}
.post-photo.sq{aspect-ratio:1}
.post-photo svg,.post-photo img{width:100%;height:100%;display:block;object-fit:cover}
.post-body{padding:12px 14px 14px;display:flex;flex-direction:column;gap:10px}
.react{display:flex;gap:8px;align-items:center}
.kudos{border:1.5px solid var(--ctl);background:var(--surface);border-radius:999px;padding:6px 12px;font-weight:700;font-size:.85rem;display:inline-flex;gap:6px;align-items:center}
.kudos svg{width:17px;height:17px}
.kudos[aria-pressed="true"]{background:var(--tan-soft);border-color:var(--tan);color:var(--tan-ink)}
.kudos[aria-pressed="true"] svg{fill:currentColor}
.comment{font-size:.88rem}
.comment b{font-weight:700}
.alert-card{border:2px solid var(--danger);background:var(--danger-soft)}
.alert-card h3{color:var(--danger)}
.newbies{display:flex;gap:10px;overflow-x:auto;scrollbar-width:none}
.newbie{flex:none;width:132px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center}
.newbie .ava{width:56px;height:56px}
.poll-opt{position:relative;width:100%;text-align:left;border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 12px;font-weight:600;overflow:hidden;display:flex;justify-content:space-between;gap:8px}
.poll-opt i{position:absolute;inset:0 auto 0 0;background:var(--gold-soft);z-index:0;transition:width .6s ease-out}
.poll-opt span{position:relative;z-index:1}
.poll-opt.mine{border-color:var(--gold)}
.composer-photo{aspect-ratio:16/10;max-width:100%;border:2px dashed var(--line);border-radius:14px;display:grid;place-items:center;color:var(--muted);overflow:hidden;background:var(--sunk);cursor:pointer;position:relative}
.composer-photo img{width:100%;height:100%;object-fit:cover}
.composer-photo input{position:absolute;inset:0;opacity:0;cursor:pointer}

/* Q&A, groups, places */
.q{gap:8px}
.vote{display:flex;flex-direction:column;align-items:center;border:1.5px solid var(--ctl);border-radius:12px;padding:4px 8px;background:var(--surface);font-weight:800;font-size:.85rem;min-width:46px}
.vote svg{width:18px;height:18px}
.vote[aria-pressed="true"]{border-color:var(--spruce);color:var(--spruce);background:var(--spruce-soft)}
.answer{border-left:3px solid var(--line);padding:6px 0 6px 12px;display:flex;flex-direction:column;gap:6px}
.answer.best{border-left-color:var(--ok)}
.group-ico{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;flex:none;font-family:var(--f-display);font-weight:800;font-size:1.1rem}
.stars{color:var(--tan-ink);font-weight:800}

/* league */
.league-head{background:linear-gradient(160deg,var(--spruce),var(--ledge));color:var(--on-spruce);border:0}
.league-head .muted{color:color-mix(in srgb,var(--on-spruce) 88%,transparent)}
.lb{display:flex;flex-direction:column}
.lb-row{display:grid;grid-template-columns:28px 40px 1fr auto;gap:10px;align-items:center;padding:9px 4px;border-bottom:1px solid var(--line)}
.lb-row:last-child{border-bottom:0}
.lb-row.me{background:var(--gold-soft);border-radius:12px;border-bottom-color:transparent;padding-inline:8px}
.lb-rank{font-family:var(--f-display);font-weight:800;text-align:center;color:var(--muted)}
.zone{font-size:.72rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;padding:6px 4px;display:flex;align-items:center;gap:8px}
.zone::after{content:"";flex:1;height:1px;background:currentColor;opacity:.35}
.zone.up{color:var(--ok)} .zone.down{color:var(--danger)}

/* dog card */
.dogcard-wrap{perspective:1200px;display:flex;justify-content:center}
.dogcard{width:min(320px,100%);aspect-ratio:5/7;max-width:100%;position:relative;transform-style:preserve-3d;transition:transform .6s cubic-bezier(.3,1.2,.4,1);cursor:pointer;border:0;padding:0;background:none}
.dogcard.flip{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:20px;padding:10px;display:flex;flex-direction:column;box-shadow:var(--shadow);text-align:left}
.face.back{transform:rotateY(180deg)}
.face-in{flex:1;border-radius:13px;background:var(--surface);display:flex;flex-direction:column;overflow:hidden;min-height:0}
.r-common{background:linear-gradient(145deg,#9C948A,#CFC8BD)}
.r-uncommon{background:linear-gradient(145deg,#1F4E6E,#8EC1E0)}
.r-rare{background:linear-gradient(145deg,#2D4F8A,#8DB4E8)}
.r-epic{background:linear-gradient(145deg,#6A3D8F,#C89BE8)}
.r-legendary{background:linear-gradient(145deg,#B07A12,#F5C35B,#B07A12)}
.card-top{display:flex;justify-content:space-between;align-items:center;padding:10px 12px 6px}
.card-top b{font-family:var(--f-display);font-size:1.3rem;font-weight:800}
.card-art{margin:0 12px;border-radius:10px;overflow:hidden;aspect-ratio:4/3;max-width:100%;background:var(--sunk);flex:none}
.card-art svg,.card-art img{width:100%;height:100%;display:block;object-fit:cover}
.card-stats{padding:8px 12px 12px;display:flex;flex-direction:column;gap:5px;font-size:.78rem;flex:1;justify-content:center}
.cs{display:grid;grid-template-columns:62px 1fr 24px;gap:8px;align-items:center;font-weight:700}
.cs .bar{height:7px}
.badge-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:10px}
.badge{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;padding:10px 6px;border-radius:14px;background:var(--surface);border:1px solid var(--line);font-size:.75rem;font-weight:700;line-height:1.2}
.medal{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;background:var(--gold);color:var(--on-gold);box-shadow:inset 0 -3px 0 rgba(0,0,0,.15)}
.medal svg{width:24px;height:24px}
.badge.locked{opacity:.55}
.badge.locked .medal{background:var(--sunk);color:var(--muted);box-shadow:none}
.binder{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:10px}
.mini{border-radius:12px;padding:5px;aspect-ratio:5/7;max-width:100%;display:flex}
.mini .face-in{border-radius:8px;align-items:center;justify-content:center;gap:4px;padding:6px;text-align:center;font-size:.72rem;font-weight:700}
.mini .face-in svg{width:56px;height:56px}
.mini.empty{border:2px dashed var(--line);background:transparent}
.mini.empty .face-in{background:transparent;color:var(--muted)}
.swatches{display:flex;gap:8px;flex-wrap:wrap}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 12px;border:1.5px solid var(--line);border-radius:12px}
.switch{width:46px;height:28px;border-radius:999px;background:var(--ctl);border:0;position:relative;flex:none;transition:background .2s}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--surface);transition:transform .2s;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.switch[aria-checked="true"]{background:var(--spruce)}
.switch[aria-checked="true"]::after{transform:translateX(18px)}

/* sheet, toast, level up */
.scrim{position:fixed;inset:0;background:rgba(10,8,6,.5);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:620px;max-height:88%;overflow:auto;border-radius:22px 22px 0 0;padding:8px 16px calc(20px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px;animation:up .28s cubic-bezier(.2,1,.3,1)}
.grab{width:42px;height:5px;border-radius:9px;background:var(--line);margin:4px auto 0}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
.toasts{position:fixed;left:0;right:0;bottom:calc(76px + env(safe-area-inset-bottom,0px));z-index:60;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none;padding-inline:16px}
.toast{background:var(--ink);color:var(--bg);padding:9px 14px;border-radius:999px;font-weight:700;font-size:.88rem;display:flex;gap:8px;align-items:center;box-shadow:var(--shadow);animation:pop .3s cubic-bezier(.3,1.5,.5,1)}
.toast .x{background:var(--gold);color:var(--on-gold);border-radius:999px;padding:1px 8px;font-size:.8rem}
@keyframes pop{from{transform:translateY(12px) scale(.9);opacity:0}to{transform:none;opacity:1}}
.levelup{text-align:center;align-items:center}
.levelup .nova{width:120px;height:120px;animation:wag 1s ease-in-out 2}
@keyframes wag{0%,100%{transform:rotate(0)}25%{transform:rotate(-6deg)}75%{transform:rotate(6deg)}}
.levelup .big-level{color:var(--tan-ink);font-size:3.2rem}

/* ---------- state ---------- */
const KEY='novapack.v1';
const dkey = (d=new Date()) => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const monday = (d=new Date()) => { const x=new Date(d); const k=(x.getDay()+6)%7; x.setDate(x.getDate()-k); return dkey(x); };
const hash = s => [...s].reduce((a,c)=>(a*31+c.charCodeAt(0))>>>0,7);
function offeredFor(day){ const ids=CHALLENGES.map(c=>c.id); const h=hash(day); const out=[]; let i=0; while(out.length<5){ const id=ids[(h+i*7)%ids.length]; if(!out.includes(id)) out.push(id); i++; } return out; }
function fresh(){
  const today=dkey();
  return { v:1, tab:'today',
    dog:{name:'Nova', breed:'gsd', age:'1', city:'Limerick', space:false, photo:'nova', insta:'novathehumanhandler'},
    xp:262, day:today, dayXP:0, counts:{}, offered:offeredFor(today), picked:[], done:[],
    week:monday(), weekXP:0, walkDays:[], streakWeeks:3, passes:2,
    stats:{zoomies:34, smarts:22, snoot:28, pack:14, chill:18},
    t:{walks:6, rainy:2, early:1, tricks:4, newRoutes:1, meetups:0, answers:1, welcomes:0, vouches:0, posts:1, heroes:0},
    q:{newRoutes:1, social:0, tricks:1}, questDone:false,
    badges:['founder','first-sniff'], myPosts:[], kudos:{}, votes:{}, qvotes:{}, myAnswers:{}, myQuestions:[], rsvp:{}, checked:{}, vouched:{}, greeted:{}, binder:[],
    lbHidden:false, board:'league', packView:'ask', placeCat:'Vets', feedFilter:'all', alert:null, openQ:null };
}
let S;
try{ S = JSON.parse(localStorage.getItem(KEY)) || fresh(); }catch(e){ S = fresh(); }
if(!S || S.v!==1) S=fresh();
if(S.dog.name==='Nova' && S.dog.breed==='gsd' && !S.dog.photo && !S.dog.noPhoto) S.dog.photo='nova';
if(S.dog.insta===undefined) S.dog.insta = S.dog.name==='Nova' ? 'novathehumanhandler' : '';
const igURL = h => `https://www.instagram.com/${encodeURIComponent(h)}/`;
const photoSrc = k => S.dog.photo==='nova' ? (k==='ava'?'img/face.jpg':'img/card.jpg') : S.dog.photo;
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){ /* storage full or blocked: keep playing in memory */ } }
function rollover(){
  const today=dkey(), wk=monday();
  if(S.week!==wk){
    const hit = S.walkDays.length>=3;
    if(hit) S.streakWeeks++; else if(S.passes>0){ S.passes--; } else S.streakWeeks=0;
    S.week=wk; S.weekXP=0; S.walkDays=[]; S.q={newRoutes:0,social:0,tricks:0}; S.questDone=false;
  }
  if(S.day!==today){ S.day=today; S.dayXP=0; S.counts={}; S.offered=offeredFor(today); S.picked=[]; S.done=[]; }
}
rollover();
const quest = () => QUESTS[hash(S.week)%QUESTS.length];
const rarity = () => { const L=levelOf(S.xp); const hi=Object.values(S.stats).filter(v=>v>=50).length;
  if(L>=30) return 'legendary'; if(S.streakWeeks>=26) return 'epic'; if(hi>=3) return 'rare'; if(L>=5) return 'uncommon'; return 'common'; };

/* ---------- XP engine ---------- */
function award(action, label){
  const [base,cap]=XP[action]; const n=S.counts[action]||0;
  S.counts[action]=n+1;
  if(n>=cap){ toast(`${label} logged. Daily XP cap reached for this one.`); return 0; }
  let amt = S.dayXP>=200 ? Math.ceil(base/2) : base;
  const before=levelOf(S.xp);
  S.xp+=amt; S.dayXP+=amt; S.weekXP+=amt;
  toast(label, amt);
  const after=levelOf(S.xp);
  if(after>before) setTimeout(()=>{ if(document.querySelector('.scrim')) pendingLevel=after; else levelUp(after); }, 450);
  return amt;
}
function bump(stat, by=1){ S.stats[stat]=Math.min(99,(S.stats[stat]||0)+by); }
function checkBadges(){
  BADGES.forEach(b=>{ if(!S.badges.includes(b.id) && b.ok(S)){ S.badges.push(b.id); setTimeout(()=>toast(`Badge earned: ${b.n}`),900); } });
}
function checkQuest(){
  const q=quest();
  if(!S.questDone && (S.q[q.key]||0)>=q.goal){ S.questDone=true; award('quest', `Weekly quest done: ${q.t}`); }
}
function after(){ checkBadges(); checkQuest(); save(); render(); }

/* ---------- UI helpers ---------- */
function toast(msg, xp){
  const el=document.createElement('div'); el.className='toast';
  el.innerHTML = `<span>${esc(msg)}</span>${xp?`<span class="x num">+${xp} XP</span>`:''}`;
  const box=document.getElementById('toasts'); box.appendChild(el);
  while(box.children.length>3) box.firstChild.remove();
  setTimeout(()=>el.remove(), 2600);
}
let opener=null;
function focusKey(el){ return el && el.dataset ? `[data-act="${el.dataset.act}"]${el.dataset.id?`[data-id="${el.dataset.id}"]`:''}${el.dataset.tab?`[data-tab="${el.dataset.tab}"]`:''}${el.dataset.k?`[data-k="${el.dataset.k}"]`:''}${el.dataset.i?`[data-i="${el.dataset.i}"]`:''}` : null; }
function setInert(on){ ['app','tabs'].forEach(id=>{ const n=document.getElementById(id); if(n) n.inert=on; }); document.querySelector('.top').inert=on; document.body.style.overflow=on?'hidden':''; }
function openSheet(html){
  if(!document.querySelector('.scrim')) opener=focusKey(document.activeElement);
  document.getElementById('sheetRoot').innerHTML = `<div class="scrim" data-act="scrim"><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle"><div class="grab"></div>${html}</div></div>`;
  const h=document.querySelector('.sheet h2'); if(h) h.id='sheetTitle';
  setInert(true);
  const f=document.querySelector('.sheet input, .sheet textarea, .sheet button'); if(f) f.focus({preventScroll:true});
}
function closeSheet(){ const had=!!document.querySelector('.scrim'); document.getElementById('sheetRoot').innerHTML=''; setInert(false);
  if(had){ const k=opener; opener=null; setTimeout(()=>{ const t=k&&document.querySelector(k); if(t) t.focus({preventScroll:true}); if(pendingLevel){ const L=pendingLevel; pendingLevel=null; levelUp(L); } },0); } }
let pendingLevel=null;
function levelUp(L){
  openSheet(`<div class="stack levelup"><div class="nova">${novaSVG()}</div><p class="eyebrow">Level up</p><div class="big-level num">Level ${L}</div><h2>${titleOf(L)}</h2><p class="muted">Promotion approved by management (Nova). She still wants a raise.</p><button class="btn primary block" data-act="close">Keep going</button></div>`);
  confetti();
}
function confetti(){
  if(matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const c=document.getElementById('confetti'); c.hidden=false; const x=c.getContext('2d');
  const W=c.width=innerWidth, H=c.height=innerHeight;
  const cols=['#F2B544','#1F4E6E','#C27A3A','#8EC1E0','#E0566E'];
  const ps=Array.from({length:120},()=>({x:W/2+(Math.random()-.5)*80,y:H*.35,vx:(Math.random()-.5)*9,vy:-Math.random()*11-3,r:Math.random()*6+4,a:Math.random()*6,c:cols[Math.floor(Math.random()*cols.length)]}));
  let f=0; (function tick(){ x.clearRect(0,0,W,H); ps.forEach(p=>{p.vy+=.32;p.x+=p.vx;p.y+=p.vy;p.a+=.15;x.save();x.translate(p.x,p.y);x.rotate(p.a);x.fillStyle=p.c;x.fillRect(-p.r/2,-p.r/4,p.r,p.r/2);x.restore();});
    if(++f<110) requestAnimationFrame(tick); else { x.clearRect(0,0,W,H); c.hidden=true; } })();
}
function myAva(){ return S.dog.photo ? `<img src="${photoSrc('ava')}" alt="${esc(S.dog.name)}">` : dogSVG(S.dog.breed,{bg:'#DDE8F1',tag:S.dog.breed==='gsd',nova:S.dog.breed==='gsd',label:S.dog.name}); }
function resize(file, max=900){
  return new Promise((res,rej)=>{ const r=new FileReader(); r.onerror=rej; r.onload=()=>{ const im=new Image(); im.onload=()=>{ const k=Math.min(1,max/Math.max(im.width,im.height)); const c=document.createElement('canvas'); c.width=Math.round(im.width*k); c.height=Math.round(im.height*k); c.getContext('2d').drawImage(im,0,0,c.width,c.height); res(c.toDataURL('image/jpeg',.82)); }; im.onerror=rej; im.src=r.result; }; r.readAsDataURL(file); });
}

}
function vToday(){
  const L=levelOf(S.xp), lo=xpFor(L), hi=xpFor(L+1), pct=Math.round((S.xp-lo)/(hi-lo)*100);
  const hour=new Date().getHours(); const greet=hour<12?'Morning':hour<18?'Afternoon':'Evening';
  const days=['M','T','W','T','F','S','S']; const ws=new Date(S.week+'T00:00'); const todayIdx=(new Date().getDay()+6)%7;
  const wk=days.map((d,i)=>{const dt=new Date(ws);dt.setDate(ws.getDate()+i);const on=S.walkDays.includes(dkey(dt));return `<div class="day ${on?'on':''} ${i===todayIdx?'today':''}" role="img" aria-label="${['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'][i]}: ${on?'walked':'no walk yet'}">${d}</div>`;}).join('');
  const q=quest(), qp=Math.min(q.goal,S.q[q.key]||0);
  const offered=S.offered.map(id=>CHALLENGES.find(c=>c.id===id));
  const picking=S.picked.length<3;

  }).join('');
  const line = S.alert ? `Stay close to your phone. The pack is looking out for ${esc(S.dog.name)}.`
    : S.done.length===3 ? `Three for three. Management (me) is impressed. Raise pending.`
    : S.walkDays.includes(dkey()) ? `Walk logged. Adequate. Now, about that challenge list.`
    : hour<12 ? `Morning, human. The lead is by the door. I've been patient for four minutes.`
    : hour<18 ? `Afternoon report: no walk logged yet. I'm noting this for your review.`
    : `Evening, human. The river looks great at sunset. Just saying.`;
  return `${alertBanner()}
  <section class="hero"><img src="img/hero.jpg" alt="Nova sitting by the River Shannon at sunset"><div class="hero-over"><p class="eyebrow">Nova · Professional human handler</p><div class="speech">${line}</div></div></section>

  <section class="card progress-card">
    <div class="row between"><div><p class="eyebrow" style="color:inherit;opacity:.8">${titleOf(L)}</p><div class="big-level num">Level ${L}</div></div>
      <div class="ava" style="width:58px;height:58px;border:3px solid var(--gold)">${myAva()}</div></div>
    <div class="bar" role="progressbar" aria-valuenow="${pct}" aria-valuemin="0" aria-valuemax="100" aria-label="Progress to next level"><i style="width:${pct}%"></i></div>
    <p class="small muted num">${fmt(hi-S.xp)} XP to Level ${L+1} · ${titleOf(L+1)}</p>
    <div class="statline">
      <div class="stat"><b class="num">${S.streakWeeks}</b><span>week streak</span></div>
      <div class="stat"><b class="num">${S.passes}</b><span>Paw Passes</span></div>
      <div class="stat"><b class="num">${S.dayXP}</b><span>XP today</span></div>
    </div>
  </section>

  <section class="quick">
    <button class="btn gold" data-act="walk">${ic('route')}Log a walk</button>
    <button class="btn primary" data-act="trick">${ic('sparkle')}Trick session</button>
  </section>

  <section class="card">
    <div class="section-head"><h3>This week's walks</h3><span class="small muted num">${S.walkDays.length}/3 days for the streak</span></div>
    <div class="week">${wk}</div>

  <section class="stack">

function postCard(p){
  const who = p.mine ? {owner:'You', dog:S.dog.name, city:S.dog.city} : {...M[p.by], city:cityOf(p.by)};

function vLeague(){
  const L=levelOf(S.xp); const lg=LEAGUE_NAMES[Math.min(4,Math.floor(L/6))];
  const dleft=7-((new Date().getDay()+6)%7);
  if(S.lbHidden) return `<section class="card"><h3>Leaderboards are hidden</h3><p class="muted">XP, badges and quests keep working. Leaderboards are always optional.</p><button class="btn primary" data-act="lbToggle">Show leaderboards</button></section>`;
  const boards=[['league',`${lg} League`],['city',S.dog.city],['breed',BREEDS[S.dog.breed].label+'s'],['new','New this month']];
  let rows=RIVALS.map(([n,id,xp])=>({n,id,xp}));
  if(S.board==='city') rows=rows.filter((_,i)=>i%2===1).map(r=>({...r,xp:Math.round(r.xp*.7)}));
  if(S.board==='breed') rows=rows.slice(0,8).map((r,i)=>({...r,xp:Math.round(r.xp*.8)-i*5}));
  if(S.board==='new') rows=rows.slice(6).map(r=>({...r,xp:Math.round(r.xp*.9)}));
  rows.push({n:'You',me:true,xp:S.weekXP});
  rows.sort((a,b)=>b.xp-a.xp);
  const myI=rows.findIndex(r=>r.me); const above=rows[myI-1];
  const pctile=Math.max(1,Math.round((myI+1)/rows.length*100));
  const lb=rows.map((r,i)=>{
    const zoneUp = S.board==='league' && i===7 ? `<div class="zone up">Promotion zone above</div>`:'';
    const zoneDn = S.board==='league' && i===rows.length-5 ? `<div class="zone down">Drop zone below · new members are safe for 4 weeks</div>`:'';
    const ava = r.me ? myAva() : memAva(r.id);
    return `${zoneUp}${zoneDn}<div class="lb-row ${r.me?'me':''}"><span class="lb-rank num">${i+1}</span><div class="ava">${ava}</div><div class="grow"><b>${esc(r.me?S.dog.name+' (you)':M[r.id].dog)}</b><div class="small muted">${esc(r.me?S.dog.city:r.n+' · '+cityOf(r.id))}</div></div><b class="num">${fmt(r.xp)}</b></div>`;}).join('');
  return `<section class="card league-head"><p class="eyebrow" style="color:inherit;opacity:.8">This week · resets in ${dleft} day${dleft===1?'':'s'}</p><h2>${lg} League</h2>
    <p class="muted">Top ${pctile}% so far${above?` · ${fmt(above.xp-S.weekXP+1)} XP to pass ${esc(above.me?'':M[above.id].dog)}`:' · You lead the league'}</p>
    <p class="small muted">Scored on consistency and helping others, never distance or speed. Small and senior dogs compete fairly.</p></section>
  <div class="chips" role="group" aria-label="Leaderboard">${boards.map(([k,l])=>`<button class="chip" aria-pressed="${S.board===k}" data-act="board" data-k="${k}">${esc(l)}</button>`).join('')}</div>
  <section class="card"><div class="lb">${lb}</div></section>
  <section class="card"><div class="section-head"><div><p class="eyebrow">Pack vs Pack · October</p><h3>${esc(S.dog.city)} Riverside Walkers</h3></div><span class="pill gold">Shared reward</span></div>
    <p class="muted">Group goal: 1,000 walks this month. Every walk you log counts.</p><div class="bar spruce"><i style="width:${Math.min(100,(642+S.t.walks)/10)}%"></i></div><p class="small muted num">${642+S.t.walks} / 1,000 walks</p></section>
  <button class="btn ghost" data-act="lbToggle">${ic('x')}Hide leaderboards</button>
  <p class="small muted" style="text-align:center">Rival scores are examples for this prototype.</p>`;
}

  <div class="row"><div class="field grow"><label for="eAge">Age (years)</label><input class="input" id="eAge" inputmode="numeric" value="${esc(d.age)}" maxlength="2"></div><div class="field grow"><label for="eCity">City</label><input class="input" id="eCity" value="${esc(d.city)}" maxlength="30"></div></div>
  <div class="field"><label for="eInsta">${esc(d.name)}'s Instagram</label><div class="row" style="gap:6px"><span style="font-weight:800;color:var(--muted)">@</span><input class="input" id="eInsta" value="${esc(d.insta||'')}" placeholder="dog's handle" autocapitalize="off" autocomplete="off" spellcheck="false" maxlength="31"></div><p class="small muted">Adds a Follow button in the Pack Directory and makes ${esc(d.name)} eligible for Shout-out Saturday.</p></div>
  <div class="toggle"><span><b>Needs space</b><br><span class="small muted">Shows a tag to nearby members and puts quiet routes first</span></span><button class="switch" role="switch" aria-checked="${d.space}" data-act="sw" id="eSpace" aria-label="Needs space"></button></div>
  <button class="btn primary block" data-act="saveDog">Save</button>`);
}
function lostSheet(){
  if(S.alert){ S.tab='today'; save(); render(); return; }
  openSheet(`<h2>Send a lost dog alert</h2>
  <p class="muted">Members within 5 km of the spot get an alert with ${esc(S.dog.name)}'s card as a flyer.</p>
  <div class="row card" style="padding:12px"><div class="ava" style="width:64px;height:64px">${myAva()}</div><div class="grow"><b>${esc(S.dog.name)}</b><div class="small muted">${esc(BREEDS[S.dog.breed].label)} · ${esc(S.dog.age)} yr · ${esc(S.dog.city)}</div>${S.dog.space?'<span class="pill tan">Nervous, don\'t chase</span>':''}</div></div>
  <div class="field"><label for="lWhere">Last seen where?</label><input class="input" id="lWhere" placeholder="e.g. river path near the bridge"></div>
  <div class="field"><label for="lWhen">When?</label><input class="input" id="lWhen" placeholder="e.g. 20 minutes ago"></div>
  <div class="note gold">${ic('alert')}<span>Prototype: this pins an alert in the app. Also call your local pound, nearby vets and your microchip database.</span></div>
  <button class="btn danger block" data-act="sendAlert">Send alert to nearby members</button>`);
}

/* ---------- actions ---------- */
const A = {
  tab(el){ S.tab=el.dataset.tab; if(el.dataset.view) S.packView=el.dataset.view; save(); render(); scrollTo({top:0}); },
  close: closeSheet,
  scrim(el,e){ if(e.target===el) closeSheet(); },
  walk: walkSheet,
  pickChip(el){ el.parentElement.querySelectorAll('.chip').forEach(c=>c.setAttribute('aria-pressed',c===el)); },
  sw(el){ el.setAttribute('aria-checked', el.getAttribute('aria-checked')!=='true'); },
  saveWalk(){
    const on=id=>document.getElementById(id).getAttribute('aria-checked')==='true';
    const mins=+document.querySelector('#walkLen [aria-pressed="true"]').dataset.k;
    const rain=on('wRain'), early=on('wEarly'), isNew=on('wNew');
    closeSheet();
    S.t.walks++; if(rain) S.t.rainy++; if(early) S.t.early++;
    if(isNew){ S.t.newRoutes++; S.q.newRoutes=(S.q.newRoutes||0)+1; bump('snoot',2); }
    bump('zoomies', mins>=30?2:1);
    const td=dkey(); if(!S.walkDays.includes(td)) S.walkDays.push(td);
    award('walk', `${mins}-minute walk logged`); after();
  },
  trick(){ S.t.tricks++; S.q.tricks=(S.q.tricks||0)+1; bump('smarts',1); award('trick','Trick session logged'); if(S.t.tricks%3===0) setTimeout(()=>toast(`Trick mastered. That's ${Math.floor(S.t.tricks/3)} so far.`),700); after(); },
  chalPick(el){ if(S.picked.length<3 && !S.picked.includes(el.dataset.id)) S.picked.push(el.dataset.id); save(); render(); },
  chalDone(el){ const c=CHALLENGES.find(x=>x.id===el.dataset.id); if(S.done.includes(c.id)) return; S.done.push(c.id); bump(c.stat,2);
    if(c.id==='route'){ S.t.newRoutes++; S.q.newRoutes=(S.q.newRoutes||0)+1; }
    if(c.id==='trick3'||c.id==='recall'){ S.q.tricks=(S.q.tricks||0)+1; }
    award('challenge', 'Challenge complete'); after(); },
  compose: composeSheet,
  async post(){
    const text=document.getElementById('cText').value.trim(); const img=document.getElementById('cPhoto').dataset.img||null;
    if(!text && !img){ toast('Add a photo or a caption first.'); return; }
    const tag=document.getElementById('cTag').value;
    closeSheet();
    S.myPosts.unshift({id:'my'+Date.now(), text, img, scene:'park', tag, kudos:0, ago:'just now', comments:[]});
    if(S.myPosts.length>12) S.myPosts.length=12;
    S.t.posts++; bump('zoomies',1); award('post','Photo shared'); S.tab='feed'; after();
  },
  kudos(el){ const id=el.dataset.id; S.kudosEver=S.kudosEver||{}; if(S.kudos[id]){ delete S.kudos[id]; save(); render(); return; } S.kudos[id]=1;
    if(S.kudosEver[id]){ save(); render(); return; } S.kudosEver[id]=1; award('kudos','Good dog given'); after(); },
  comment(el){ const id=el.dataset.id;
    openSheet(`<h2>Add a comment</h2><div class="field"><label for="cmText">Comment</label><textarea class="input" id="cmText" maxlength="200"></textarea></div><button class="btn primary block" data-act="saveComment" data-id="${id}">Post comment</button>`); },
  saveComment(el){ const t=document.getElementById('cmText').value.trim(); if(!t) return; const k='c_'+el.dataset.id; (S.myAnswers[k]=S.myAnswers[k]||[]).push(t); closeSheet(); toast('Comment posted'); save(); render(); },
  vote(el){ const id=el.dataset.id; if(S.votes[id]!=null) return; S.votes[id]=+el.dataset.i; award('vote','Vote counted'); after(); },
  welcome(el){ S.greeted[el.dataset.i]=1; S.t.welcomes++; bump('pack',1); award('welcome','Newcomer welcomed'); after(); },
  spotted(){ openSheet(`<h2>Thanks for looking out</h2><p class="muted">In the live app this sends your location and a photo straight to Rex's owner. For now, here's how it would feel.</p><button class="btn danger block" data-act="spottedSend">Send sighting</button>`); },
  spottedSend(){ closeSheet(); S.t.heroes++; bump('pack',3); toast('Sighting sent. Rex is home safe.'); award('meetup','Pack Hero sighting'); after(); },
  hashDone(){ S.hashWeek=S.week; bump('pack',2); award('hashtag','Instagram challenge entered'); after(); },
  dirFilter(el){ S.dirFilter=el.dataset.k; save(); render(); },
  feedFilter(el){ S.feedFilter=el.dataset.k; save(); render(); },
  packView(el){ S.packView=el.dataset.k; save(); render(); },
  ask(){ const t=document.getElementById('askText').value.trim(); if(t.length<8){ toast('Write a bit more so people can help.'); return; }
    const tag=document.getElementById('askTag').value;
    S.myQuestions.unshift({id:'mq'+Date.now(), mine:true, tag: HEALTH_WORDS.test(t)?'Health':tag, title:t, votes:0, answers:[]});
    award('ask','Question posted'); after(); },
  qvote(el){ const id=el.dataset.id; S.qvotes[id]=!S.qvotes[id]; save(); render(); },
  openQ(el){ S.openQ = S.openQ===el.dataset.id ? null : el.dataset.id; save(); render(); },
  answer(el){ const id=el.dataset.id; const t=document.getElementById('ans_'+id).value.trim(); if(t.length<4){ toast('Add your answer first.'); return; }
    (S.myAnswers[id]=S.myAnswers[id]||[]).push(t); S.t.answers++; S.q.social=(S.q.social||0)+1; bump('pack',1);
    if(S.offered.includes('answer') && S.picked.includes('answer') && !S.done.includes('answer')){ S.done.push('answer'); bump('pack',2); award('challenge','Challenge complete'); }
    award('answer','Answer posted'); after(); },
  rsvp(el){ S.rsvp[el.dataset.id]=1; toast('You\'re in. We\'ll remind you the day before.'); save(); render(); },
  checkin(el){ const g=groups().find(x=>x.id===el.dataset.id); S.checked[g.id]=1; S.t.meetups++; S.q.social=(S.q.social||0)+1; bump('pack',3); bump('chill',1);
    if(g.meet && !S.binder.includes(g.meet)){ S.binder.push(g.meet); setTimeout(()=>toast(`Card collected: ${M[g.meet].dog}`),800); }
    award('meetup','Meetup check-in'); after(); },
  placeCat(el){ S.placeCat=el.dataset.k; save(); render(); },
  vouch(el){ S.vouched[el.dataset.id]=1; S.t.vouches++; award('review','Vouch added'); after(); },
  board(el){ S.board=el.dataset.k; save(); render(); },
  lbToggle(){ S.lbHidden=!S.lbHidden; save(); render(); },
  flip(){ document.getElementById('dogcard').classList.toggle('flip'); },
  editDog: editSheet,
  clearPhoto(){ S.dog.photo=null; S.dog.noPhoto=true; save(); closeSheet(); render(); },
  saveDog(){ const n=document.getElementById('eName').value.trim()||S.dog.name;
    S.dog={...S.dog, name:n, breed:document.getElementById('eBreed').value, age:(document.getElementById('eAge').value.replace(/\D/g,'')||S.dog.age), city:document.getElementById('eCity').value.trim()||S.dog.city, space:document.getElementById('eSpace').getAttribute('aria-checked')==='true', insta:document.getElementById('eInsta').value.trim().replace(/^@/,'').replace(/[^A-Za-z0-9._]/g,'').slice(0,30)};
    closeSheet(); toast('Saved'); save(); render(); },
  lost: lostSheet,
  sendAlert(){ const w=document.getElementById('lWhere').value.trim(); if(!w){ toast('Add where you last saw them.'); return; }
    S.alert={where:w, when:document.getElementById('lWhen').value.trim()}; closeSheet(); S.tab='today'; save(); render(); toast('Alert pinned for nearby members'); },
  found(){ S.alert=null; save(); render(); toast(`So glad ${S.dog.name} is home.`); },
  reset(){ document.getElementById('resetBox').innerHTML=`<div class="stack"><p class="small">This clears your dog, XP and badges on this device.</p><div class="row"><button class="btn danger grow" data-act="resetYes">Yes, start over</button><button class="btn ghost grow" data-act="resetNo">Cancel</button></div></div>`; },
  resetYes(){ S=fresh(); save(); render(); scrollTo({top:0}); toast('Fresh start. Welcome to the pack.'); },
  resetNo(){ render(); },
};
document.addEventListener('click', e=>{ const el=e.target.closest('[data-act]'); if(!el||el.disabled) return; const f=A[el.dataset.act]; if(!f) return;
  const k=focusKey(el); const inSheet=!!el.closest('.sheet'); f(el,e);
  if(!inSheet && !document.querySelector('.scrim') && k && !document.body.contains(el)){ const t=document.querySelector(k)||document.querySelector('#app button'); if(t) t.focus({preventScroll:true}); } });
document.addEventListener('change', async e=>{
  const el=e.target; if(!el.dataset||!el.dataset.file||!el.files||!el.files[0]) return;
  try{
    const url=await resize(el.files[0]);
    if(el.dataset.file==='compose'){ const box=document.getElementById('cPhoto'); box.dataset.img=url; box.querySelectorAll('svg,span,img').forEach(n=>n.remove()); box.insertAdjacentHTML('afterbegin',`<img src="${url}" alt="Selected photo">`); }
    else { S.dog.photo=await resize(el.files[0],600); S.dog.noPhoto=false; save(); editSheet(); render(); }
  }catch(err){ toast('That photo could not be read. Try a JPG or PNG.'); }
});
document.addEventListener('input', e=>{
  if(e.target.id==='askText'){ const w=document.getElementById('vetWarn'); if(w) w.innerHTML = HEALTH_WORDS.test(e.target.value) ? `<div class="note danger">${ic('alert')}<span>This sounds like a health worry. If it's urgent, call your vet now. The pack can share experience, not a diagnosis.</span></div>` : ''; }
});
document.addEventListener('keydown', e=>{ if(e.key==='Escape') closeSheet(); });
const h=(location.hash||'').slice(1); if(TABS.some(t=>t[0]===h)) S.tab=h;
render();
</script>

</body>
